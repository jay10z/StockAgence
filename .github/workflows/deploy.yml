# Manual Continuous Delivery to AWS EC2.
# A human clicks "Run workflow" — this does not run on every Pull Request.

name: Deploy to EC2

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd ~/StockAgence
            git fetch origin
            git checkout main
            git pull origin main
            if ! sudo docker info > /dev/null 2>&1; then
              echo "Docker is not installed on this EC2 instance yet."
              echo "SSH in and run the one-time Docker install commands, then re-run this workflow."
              exit 1
            fi
            pm2 delete stockagence > /dev/null 2>&1 || true
            sudo docker compose up -d --build
            sudo docker compose ps
