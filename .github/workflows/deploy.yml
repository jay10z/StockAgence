# Manual Continuous Delivery to AWS EC2.
# A human clicks "Run workflow" — this does not run on every Pull Request.

name: Deploy to EC2

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd ~/StockAgence
            git fetch origin
            git checkout main
            git pull origin main
            npm ci
            npm run build
            if pm2 describe stockagence > /dev/null 2>&1; then
              pm2 restart stockagence --update-env
            else
              pm2 start ecosystem.config.cjs
            fi
            pm2 save
            pm2 status
